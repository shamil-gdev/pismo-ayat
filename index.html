<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a2a">
<title>Письмо для Аят</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a2a; --cream:#fbf1dc; --cream-dim:rgba(251,241,220,.72);
    --gold:#f6cf7a; --gold-2:#e0a94a; --gold-deep:#b8832a;
    --paper:#f7ebd3; --paper-dark:#e8d4ad; --ink:#3a2612; --ink-soft:rgba(58,38,18,.7); --wax:#8a2416;
    --lv:1; /* lantern light level 1..7 */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--cream);font-family:'Lora',Georgia,'Times New Roman',serif;overflow-x:hidden}
  body{min-height:100dvh;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}

  /* ===== STAGE (background layers) ===== */
  #stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
  .sky{position:absolute;inset:-6%;will-change:transform}
  .sky img{width:100%;height:100%;object-fit:cover;object-position:50% 60%;transform:scale(1.12);transform-origin:50% 45%;display:block;filter:saturate(1.05)}
  #fx{position:absolute;inset:0;width:100%;height:100%}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,transparent 40%,rgba(5,5,25,.55) 100%);pointer-events:none}
  #flash{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#fff6d8 0%,#f6cf7a 30%,rgba(10,10,42,0) 75%);opacity:0;pointer-events:none}
  .rays{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 2vh + 14vh);width:140vmax;height:140vmax;transform:translate(-50%,-50%);z-index:1;pointer-events:none;opacity:0;
      background:repeating-conic-gradient(from 0deg,rgba(246,207,122,.16) 0deg 3deg,transparent 3deg 14deg);
      -webkit-mask:radial-gradient(circle,rgba(0,0,0,.9) 0%,rgba(0,0,0,.35) 30%,transparent 62%);mask:radial-gradient(circle,rgba(0,0,0,.9) 0%,rgba(0,0,0,.35) 30%,transparent 62%)}

  /* ===== COVER ===== */
  #cover{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,40px);padding:24px}
  .cover-title{font-family:'Caveat',cursive;font-weight:700;color:var(--gold);font-size:clamp(40px,7.5vw,72px);letter-spacing:.5px;text-shadow:0 0 24px rgba(246,207,122,.45),0 2px 0 rgba(0,0,0,.3)}
  .cover-title .ch{display:inline-block;white-space:pre}
  .cover-hint{color:var(--cream-dim);font-size:clamp(14px,2.2vw,19px);font-style:italic}

  .env{position:relative;width:min(82vw,480px);aspect-ratio:1.5;perspective:1400px;cursor:pointer;filter:drop-shadow(0 36px 44px rgba(0,0,0,.65))}
  .env .back{position:absolute;inset:0;background:url("assets/parchment.jpg") center/100% 100%;border-radius:4px;filter:brightness(.78) sepia(.25)}
  .env .letter{position:absolute;left:6%;right:6%;top:9%;bottom:9%;background:url("assets/parchment.jpg") center/100% 100%;border-radius:3px;z-index:1;box-shadow:0 4px 14px rgba(0,0,0,.3);overflow:hidden;transform-origin:50% 100%}
  .env .letter::before,.env .letter::after{content:"";position:absolute;left:12%;right:12%;height:2px;background:rgba(90,55,20,.28);border-radius:2px}
  .env .letter::before{top:28%;box-shadow:0 14px 0 rgba(90,55,20,.22),0 28px 0 rgba(90,55,20,.18),0 42px 0 rgba(90,55,20,.14)}
  .env .letter::after{top:14%;left:30%;right:30%;background:rgba(120,40,20,.5)}
  .env .front{position:absolute;inset:0;z-index:2;border-radius:4px;background:url("assets/parchment.jpg") center/100% 100%;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);filter:sepia(.15)}
  .env .front::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(60,35,10,.22) 0%,rgba(60,35,10,0) 40%);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
  .env .front::after{content:"";position:absolute;inset:0;border-radius:4px;background:linear-gradient(135deg,rgba(255,250,230,.25),transparent 45%,rgba(60,35,10,.12));pointer-events:none}
  .env .addr{position:absolute;left:0;right:0;top:74%;z-index:2;text-align:center;font-family:'Caveat',cursive;font-size:clamp(22px,4.6vw,38px);color:#4a2a12;transform:rotate(-2deg);text-shadow:0 0 1px rgba(74,42,18,.4)}
  .env .stamp{position:absolute;right:5%;bottom:6%;z-index:2;width:16%;aspect-ratio:.82;border:2px dashed rgba(110,70,30,.55);background:rgba(160,110,60,.14);display:flex;align-items:center;justify-content:center;color:#6b4320;font-size:clamp(16px,3.2vw,28px);transform:rotate(5deg)}
  .env .stamp::after{content:"✦"}
  .env .flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:3;transform-origin:top;background:url("assets/parchment.jpg") center/100% 172%;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:4px 4px 0 0;transform-style:preserve-3d;filter:brightness(.92) sepia(.2)}
  .env .flap::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,rgba(255,250,230,.12),rgba(60,35,10,.22))}
  .env .seal{position:absolute;left:50%;top:58%;width:24%;aspect-ratio:1;z-index:4;filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}
  .env .seal img{width:100%;height:100%;object-fit:contain;display:block}
  .seal-ring{position:absolute;left:50%;top:58%;width:20%;aspect-ratio:1;border-radius:50%;z-index:3;border:2px solid rgba(246,207,122,.8);pointer-events:none;opacity:0}

  /* ===== SCENE ===== */
  #scene{position:relative;z-index:2;min-height:100dvh;opacity:0;pointer-events:none}
  #scene.on{opacity:1;pointer-events:auto}

  .lantern-wrap{position:fixed;left:50%;top:calc(env(safe-area-inset-top) - 2vh);z-index:3;width:min(34vw,260px);height:min(40vh,420px);pointer-events:none;transform-origin:50% 0}
  .lantern{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 0}
  .lantern img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;object-position:50% 0;display:block;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55))}
  .lantern-glow{position:absolute;left:50%;top:60%;width:260%;height:170%;transform:translate(-50%,-50%);border-radius:50%;opacity:0;
      background:radial-gradient(circle,rgba(255,205,110,.95) 0%,rgba(255,170,70,.5) 22%,rgba(255,140,50,.18) 45%,transparent 68%);mix-blend-mode:screen}
  .lantern-core{position:absolute;left:50%;top:58%;width:34%;height:30%;transform:translate(-50%,-50%);border-radius:50%;opacity:0;
      background:radial-gradient(circle,rgba(255,245,210,.9) 0%,rgba(255,210,120,.5) 40%,transparent 70%);filter:blur(6px);mix-blend-mode:screen}
  .light-cone{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6vh);width:min(120vw,900px);height:130vh;margin-left:max(-60vw,-450px);z-index:1;pointer-events:none;opacity:0;
      background:radial-gradient(ellipse 50% 55% at 50% 12%,rgba(255,200,110,.26) 0%,rgba(255,180,90,.1) 40%,transparent 100%);
      -webkit-mask:linear-gradient(to bottom,transparent 0,#000 18%,#000 100%);mask:linear-gradient(to bottom,transparent 0,#000 18%,#000 100%)}

  .letter-card{position:relative;z-index:2;width:min(92vw,720px);margin:clamp(250px,40vh,420px) auto 140px;padding:clamp(40px,6vw,64px) clamp(24px,5vw,56px) clamp(28px,4vw,46px);
      background:url("assets/parchment.jpg") center/100% 100%;border-radius:3px;color:var(--ink);
      box-shadow:0 40px 90px rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.35);opacity:0}
  .letter-card::before{content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;box-shadow:inset 0 0 60px rgba(70,40,10,.18)}
  .letter-card .top-seal{position:absolute;top:-30px;left:50%;width:clamp(60px,10vw,84px);transform:translateX(-50%) rotate(6deg);filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
  .letter-card .top-seal img{width:100%;display:block}

  .step{margin:0 0 clamp(18px,3vh,30px);position:relative}
  .step:last-child{margin-bottom:0}
  .greet{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(44px,7.8vw,74px);line-height:1.1;color:var(--wax)}
  .step p{font-size:clamp(17px,2.4vw,22px);line-height:1.72;color:var(--ink)}
  .step p + p{margin-top:.85em}
  .step p.key{font-style:italic;color:var(--wax);font-size:clamp(20px,2.9vw,26px);text-align:center}
  .step p.sign{font-family:'Caveat',cursive;font-size:clamp(32px,5vw,48px);color:var(--ink);text-align:right;font-weight:500;margin-top:14px}
  .w,.ch{display:inline-block;white-space:pre;opacity:0;will-change:transform,opacity}

  /* bricks / foundation */
  .build{position:relative;height:118px;margin:18px auto 0;width:200px}
  .build svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .build .brick{fill:url(#bg);stroke:rgba(90,50,20,.5);stroke-width:.6;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));opacity:0}
  .build .ground{stroke:rgba(58,38,18,.8);stroke-width:2;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200}
  .build .glowline{opacity:0;filter:blur(4px);stroke:rgba(224,169,74,.9);stroke-width:4;stroke-linecap:round}

  /* dua */
  .dua-wrap{position:relative;margin-top:8px}
  .mandala{position:absolute;left:50%;top:50%;width:min(130%,720px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:0;stroke:#6b4320}
  .dua{position:relative;z-index:1;border-style:solid;border-color:transparent;border-width:clamp(52px,8.5vw,92px);
      border-image:url("assets/frame.webp") 22% 15% round;background:rgba(80,50,15,.09);background-clip:padding-box;
      margin:calc(-1 * clamp(14px,2vw,22px));padding:clamp(4px,1vw,12px);opacity:0}
  .dua-inner{position:relative;text-align:center}
  .dua p{text-align:center;color:var(--ink)}
  .dua p.amin{font-family:'Caveat',cursive;font-size:clamp(40px,6.8vw,64px);color:var(--wax);font-weight:700;margin-top:.45em}
  .dua p.amin.pulse{animation:aminp 2.4s ease-in-out infinite}
  @keyframes aminp{0%,100%{text-shadow:0 0 0 rgba(224,169,74,0)}50%{text-shadow:0 0 18px rgba(224,169,74,.9),0 0 40px rgba(224,169,74,.5)}}

  /* hint + controls */
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;z-index:4;color:var(--cream-dim);font-style:italic;font-size:clamp(13px,2vw,16px);opacity:0;transition:opacity .6s;pointer-events:none}
  #hint.show{opacity:1;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  #controls{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:8;display:flex;gap:8px}
  .cbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(246,207,122,.4);background:rgba(10,10,38,.65);color:var(--gold);font-size:18px;display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .cbtn.show{display:flex}
  .cbtn:active{transform:scale(.92)}
  #again{display:none;margin:30px auto 0;padding:13px 28px;border-radius:30px;border:1.5px solid rgba(90,50,20,.55);background:rgba(90,50,20,.08);color:var(--ink);font-family:'Lora',serif;font-size:16px;cursor:pointer;opacity:0}
  #again.show{display:block}
</style>
</head>
<body>

<div id="stage">
  <div class="sky" id="sky"><img src="assets/sky.jpg" alt=""></div>
  <canvas id="fx"></canvas>
  <div class="vignette"></div>
</div>
<div class="rays" id="rays"></div>
<div class="light-cone" id="cone"></div>
<div id="flash"></div>

<div id="controls"><button class="cbtn" id="btnSound" title="Нашид">🔊</button></div>

<!-- COVER -->
<div id="cover">
  <div class="cover-title" id="title">Письмо для Аят</div>
  <div class="env" id="env" role="button" aria-label="Открыть письмо">
    <div class="back"></div>
    <div class="letter" id="envLetter"></div>
    <div class="front"></div>
    <div class="addr">Для Аят ✦</div>
    <div class="stamp"></div>
    <div class="flap" id="flap"></div>
    <div class="seal-ring" id="sealRing"></div>
    <div class="seal" id="seal"><img src="assets/seal.webp" alt=""></div>
  </div>
  <div class="cover-hint" id="coverHint">Нажми на печать, чтобы открыть ✦</div>
</div>

<!-- LETTER -->
<div id="scene">
  <div class="lantern-wrap" id="lanternWrap">
    <div class="lantern" id="lantern">
      <div class="lantern-glow" id="lglow"></div>
      <img src="assets/lantern.webp" alt="">
      <div class="lantern-core" id="lcore"></div>
    </div>
  </div>
  <div class="letter-card" id="card"><div class="top-seal"><img src="assets/seal.webp" alt=""></div></div>
</div>
<div id="hint">коснись экрана, чтобы читать дальше ✦</div>

<audio id="nasheed" src="nasheed.mp3" loop preload="auto" playsinline></audio>

<script src="assets/gsap.min.js"></script>
<script>
/* ================= TEXT ================= */
const STEPS = [
  { html:`<h1 class="greet" id="greet">Дорогая Аят!</h1>`, fx:'greet', mode:'char' },
  { html:`<p>Как же здорово видеть твой огонёк, когда ты погружаешься в учёбу, когда глаза горят от любопытства и желания узнать что-то новое! Твоя увлечённость и старание — это настоящий подарок для всех нас.</p>`, fx:'flame' },
  { html:`<p>Помни, что каждый твой шаг, каждое новое знание — это крошечный, но важный кирпичик в фундаменте твоего будущего.</p>
          <div class="build" id="build"><svg viewBox="0 0 200 118">
            <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1c06a"/><stop offset="1" stop-color="#b9772a"/></linearGradient></defs>
            <line class="glowline" x1="20" y1="110" x2="180" y2="110"/>
            <line class="ground" x1="20" y1="110" x2="180" y2="110"/>
            <g id="bricks"></g>
          </svg></div>`, fx:'bricks' },
  { html:`<p>Не бойся трудностей: они лишь помогают нам стать сильнее и мудрее. Продолжай исследовать мир, развивать свои таланты и верить в себя! У тебя всё обязательно получится!</p>`, fx:'stars' },
  { html:`<p class="key">Главное — полагаться на Всевышнего Аллаха.</p>`, fx:'gold' },
  { html:`<div class="dua-wrap"><svg class="mandala" id="mandala" viewBox="-100 -100 200 200" fill="none" stroke="#f6cf7a" stroke-width=".7"></svg>
          <div class="dua" id="dua"><div class="dua-inner">
            <p>Пусть Аллах облегчит тебе учёбу, укрепит твою память и сделает знания полезными.</p>
            <p>Дарует тебе терпение и облегчение.</p>
            <p class="amin" id="amin">Амин.</p>
          </div></div></div>`, fx:'dua' },
  { html:`<p class="sign">— Твой Куратор ✦</p>`, fx:'sign', mode:'char' },
];

/* ================= AUDIO ================= */
let AC=null, master=null, nasheedGain=null, nasheedSrc=null, soundOn=true, crackleTimer=null, level=0;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);} if(AC.state==='suspended') AC.resume(); return AC; }
function noiseBuf(dur){ const c=ac(); const b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*dur)),c.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function noise({dur=.3,freq=1500,q=1,type='bandpass',gain=.2,attack=.01,at=0,sweep=null}={}){
  const c=ac(), t=c.currentTime+at; const s=c.createBufferSource(); s.buffer=noiseBuf(dur);
  const f=c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); if(sweep) f.frequency.exponentialRampToValueAtTime(sweep,t+dur); f.Q.value=q;
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+attack); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.05);
}
function tone(freq,{dur=2,gain=.18,at=0,type='sine',harm=true}={}){
  const c=ac(), t=c.currentTime+at; const parts=harm?[[1,1],[2,.35],[3,.12],[4.01,.05]]:[[1,1]];
  parts.forEach(([m,a])=>{ const o=c.createOscillator(); o.type=type; o.frequency.value=freq*m; const g=c.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain*a,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur*(1/(m*0.6+0.4)));
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.1); });
}
const SFX={
  sealPop(){ noise({dur:.14,freq:900,q:2,gain:.4,attack:.004}); tone(880,{dur:.6,gain:.09}); tone(1760,{dur:.4,gain:.04,at:.03,harm:false}); },
  paper(){ noise({dur:1,freq:2600,q:.6,gain:.15,attack:.15}); noise({dur:.5,freq:1200,q:.8,gain:.08,attack:.05,at:.4}); },
  slide(){ noise({dur:.8,freq:3200,q:.5,type:'highpass',gain:.08,attack:.2}); },
  whoosh(){ noise({dur:1.6,freq:300,sweep:4000,q:.8,type:'bandpass',gain:.22,attack:.5}); },
  chain(){ for(let i=0;i<4;i++){ tone(2400+Math.random()*900,{dur:.25,gain:.05,at:i*.09,harm:false}); noise({dur:.05,freq:5000,q:2,gain:.08,attack:.003,at:i*.09}); } },
  chime(n=0){ const base=[523.25,659.25,783.99,880,1046.5][n%5]; tone(base,{dur:3,gain:.14}); tone(base*1.5,{dur:2.2,gain:.05,at:.08}); },
  sparkle(){ for(let i=0;i<6;i++){ tone(1800+Math.random()*2000,{dur:.5,gain:.05,at:i*.06,harm:false}); } },
  shimmer(){ for(let i=0;i<12;i++){ tone(2000+i*180+Math.random()*200,{dur:.9,gain:.03,at:i*.05,harm:false}); } },
  tok(){ noise({dur:.08,freq:420,q:3,gain:.25,attack:.003}); tone(220,{dur:.12,gain:.08,harm:false}); },
  gold(){ [523.25,659.25,783.99].forEach((f,i)=>tone(f,{dur:3.5,gain:.09,at:i*.12})); },
  amin(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,{dur:5.5,gain:.11,at:i*.18})); setTimeout(()=>SFX.sparkle(),900); setTimeout(()=>SFX.shimmer(),1700); },
  writing(ms){ const n=Math.floor(ms/110); for(let i=0;i<n;i++) noise({dur:.07,freq:3400+Math.random()*1500,q:.7,gain:.025,attack:.01,at:i*.11+Math.random()*.03}); },
  ignite(){ noise({dur:1.4,freq:500,sweep:1800,q:.5,type:'lowpass',gain:.14,attack:.1}); tone(392,{dur:1.8,gain:.05}); },
  meteor(){ noise({dur:.9,freq:6000,sweep:900,q:.9,type:'bandpass',gain:.07,attack:.05}); },
};
function startCrackle(){ if(crackleTimer) return; const tick=()=>{ if(level>0&&soundOn) noise({dur:.03+Math.random()*.04,freq:1500+Math.random()*2500,q:1.5,gain:.01+level*.005,attack:.002}); crackleTimer=setTimeout(tick,140+Math.random()*460); }; tick(); }

const nasheed=document.getElementById('nasheed'), btnSound=document.getElementById('btnSound'); let nasheedReady=false;
nasheed.addEventListener('canplaythrough',()=>{ nasheedReady=true; btnSound.classList.add('show'); },{once:true});
nasheed.addEventListener('error',()=>{ nasheedReady=false; btnSound.classList.remove('show'); });
function startNasheed(){ if(!nasheedReady) return; try{ const c=ac();
  if(!nasheedSrc){ nasheedSrc=c.createMediaElementSource(nasheed); nasheedGain=c.createGain(); nasheedGain.gain.value=0; nasheedSrc.connect(nasheedGain); nasheedGain.connect(c.destination); }
  nasheed.play().then(()=>{ nasheedGain.gain.setValueAtTime(0,c.currentTime); nasheedGain.gain.linearRampToValueAtTime(soundOn?0.42:0,c.currentTime+5); }).catch(()=>{}); }catch(e){} }
btnSound.addEventListener('click',e=>{ e.stopPropagation(); soundOn=!soundOn; btnSound.textContent=soundOn?'🔊':'🔇';
  if(nasheedGain){ const c=ac(); nasheedGain.gain.cancelScheduledValues(c.currentTime); nasheedGain.gain.linearRampToValueAtTime(soundOn?0.42:0,c.currentTime+.6); }
  if(master) master.gain.value=soundOn?0.9:0; });

/* ================= FX CANVAS ================= */
const cv=document.getElementById('fx'), cx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const FX={parts:[],stars:[],warp:0,warpStars:[],bright:0.5,dustMax:0,shoots:[],sprite:null};
function makeSprite(){ const s=document.createElement('canvas'); s.width=s.height=64; const g=s.getContext('2d'); const r=g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,'rgba(255,250,225,1)'); r.addColorStop(.25,'rgba(255,225,150,.9)'); r.addColorStop(.6,'rgba(246,190,90,.35)'); r.addColorStop(1,'rgba(246,190,90,0)'); g.fillStyle=r; g.fillRect(0,0,64,64); FX.sprite=s; }
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); FX.stars=[]; for(let i=0;i<110;i++) FX.stars.push({x:Math.random()*W,y:Math.random()*H*.85,r:.4+Math.random()*1.3,ph:Math.random()*6.28,sp:.5+Math.random()*1.5}); }
function lanternXY(){ const el=document.getElementById('lantern'); const r=el.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height*.6}; }
function burst(x,y,n,opt={}){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, sp=(opt.speed||3)*(.3+Math.random()); FX.parts.push({t:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(opt.up||1),g:opt.g??.06,life:1,dec:.012+Math.random()*.015,s:(opt.size||3)*(.5+Math.random())}); } }
function fountain(x,y,n){ for(let i=0;i<n;i++){ const a=-Math.PI/2+(Math.random()-.5)*1.1, sp=4+Math.random()*6; FX.parts.push({t:'spark',x:x+(Math.random()-.5)*40,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.08,life:1,dec:.006+Math.random()*.008,s:2+Math.random()*3,delay:Math.random()*40}); } }
function shoot(){ FX.shoots.push({x:Math.random()*W*.9,y:Math.random()*H*.3,vx:9+Math.random()*5,vy:4+Math.random()*2,life:1}); }
function warp(sec){ FX.warp=sec; FX.warpStars=[]; for(let i=0;i<260;i++) FX.warpStars.push({a:Math.random()*6.28,d:Math.random()*40+5,sp:1+Math.random()*2}); }
let last=0;
function draw(ts){
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts; const t=ts/1000; cx.clearRect(0,0,W,H);
  for(const s of FX.stars){ const a=(.2+.8*Math.abs(Math.sin(t*s.sp+s.ph)))*FX.bright; cx.fillStyle=`rgba(255,240,215,${a})`; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.28); cx.fill(); }
  // dust
  const dust=FX.parts.filter(p=>p.t==='dust').length;
  if(dust<FX.dustMax && Math.random()<.5) FX.parts.push({t:'dust',x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*.3,vy:-(.25+Math.random()*.5),ph:Math.random()*6.28,s:1.2+Math.random()*2.2,life:1,dec:0});
  for(const p of FX.parts){
    if(p.delay>0){ p.delay--; continue; }
    if(p.t==='dust'){ p.x+=p.vx+Math.sin(t+p.ph)*.25; p.y+=p.vy; if(p.y<-20) p.life=0; const a=.35+.65*Math.abs(Math.sin(t*1.6+p.ph)); cx.globalAlpha=a*.9; cx.drawImage(FX.sprite,p.x-p.s*2,p.y-p.s*2,p.s*4,p.s*4); }
    else { p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.985; p.life-=p.dec; cx.globalAlpha=Math.max(0,p.life); const s=p.s*(0.6+p.life); cx.drawImage(FX.sprite,p.x-s*2,p.y-s*2,s*4,s*4); }
  }
  cx.globalAlpha=1; FX.parts=FX.parts.filter(p=>p.life>0);
  for(const s of FX.shoots){ s.x+=s.vx; s.y+=s.vy; s.life-=.016; const g=cx.createLinearGradient(s.x,s.y,s.x-s.vx*14,s.y-s.vy*14); g.addColorStop(0,`rgba(255,250,230,${s.life})`); g.addColorStop(1,'rgba(255,250,230,0)'); cx.strokeStyle=g; cx.lineWidth=2.2; cx.beginPath(); cx.moveTo(s.x,s.y); cx.lineTo(s.x-s.vx*14,s.y-s.vy*14); cx.stroke(); cx.globalAlpha=s.life; cx.drawImage(FX.sprite,s.x-8,s.y-8,16,16); cx.globalAlpha=1; }
  FX.shoots=FX.shoots.filter(s=>s.life>0&&s.x<W+50&&s.y<H+50);
  if(FX.warp>0){ FX.warp-=dt; const cxp=W/2, cyp=H*.42; const k=Math.min(1,(1.6-FX.warp)*1.2);
    for(const s of FX.warpStars){ s.d+=s.sp*(6+k*22); const x1=cxp+Math.cos(s.a)*s.d, y1=cyp+Math.sin(s.a)*s.d, L=s.d*0.35*k+2; const x2=cxp+Math.cos(s.a)*(s.d+L), y2=cyp+Math.sin(s.a)*(s.d+L);
      if(s.d>Math.max(W,H)) { s.d=5+Math.random()*30; }
      cx.strokeStyle=`rgba(255,240,200,${.15+k*.6})`; cx.lineWidth=1+k*1.6; cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2); cx.stroke(); } }
  requestAnimationFrame(draw);
}
makeSprite(); addEventListener('resize',resize); resize(); requestAnimationFrame(draw);

/* ================= PARALLAX ================= */
const skyEl=document.getElementById('sky'), lanternWrap=document.getElementById('lanternWrap');
gsap.set(lanternWrap,{xPercent:-50});
const skyX=gsap.quickTo(skyEl,'x',{duration:1.2,ease:'power2.out'}), skyY=gsap.quickTo(skyEl,'y',{duration:1.2,ease:'power2.out'});
let tiltX=0, scrollP=0;
function applyLantern(){ const shiftX=-(W/2-Math.min(W*.17,150))*scrollP; gsap.to(lanternWrap,{x:tiltX*10+shiftX,y:-18*scrollP,scale:1-.52*scrollP,duration:.7,ease:'power2.out',overwrite:'auto'}); gsap.to('#cone',{x:shiftX*.6,duration:.7,overwrite:'auto'}); }
function tilt(nx,ny){ skyX(nx*-22); skyY(ny*-14); tiltX=nx; applyLantern(); }
addEventListener('scroll',()=>{ const p=Math.max(0,Math.min(1,(scrollY-40)/260)); if(Math.abs(p-scrollP)>.01){ scrollP=p; applyLantern(); } },{passive:true});
function enableTilt(){
  const listen=()=>addEventListener('deviceorientation',e=>{ if(e.gamma==null) return; const landscape=Math.abs(window.orientation||0)===90||innerWidth>innerHeight;
    let gx=landscape?(e.beta||0):(e.gamma||0), gy=landscape?(e.gamma||0):((e.beta||0)-45); tilt(Math.max(-1,Math.min(1,gx/25)),Math.max(-1,Math.min(1,gy/25))); },true);
  try{ if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){ DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted') listen(); }).catch(()=>{}); } else listen(); }catch(e){}
}
addEventListener('mousemove',e=>tilt((e.clientX/W-.5)*2,(e.clientY/H-.5)*2));

/* ================= FLOW ================= */
const cover=document.getElementById('cover'), env=document.getElementById('env'), scene=document.getElementById('scene'), card=document.getElementById('card'), hint=document.getElementById('hint');
let opened=false, step=0, revealing=false, finished=false, curTween=null, curEl=null;

function setLevel(n){ level=n; FX.bright=Math.min(1,.5+n*.08); FX.dustMax=8+n*10;
  gsap.to('#lglow',{opacity:Math.min(1,.35+n*.1),scale:1+n*.06,duration:1.4,overwrite:'auto'});
  gsap.to('#lcore',{opacity:Math.min(1,.4+n*.1),duration:1.4,overwrite:'auto'});
  gsap.to('#cone',{opacity:Math.min(1,.25+n*.1),duration:1.6,overwrite:'auto'}); }

function splitText(el,mode){
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode); const out=[];
  for(const n of nodes){ if(!n.nodeValue.trim()) continue; const frag=document.createDocumentFragment();
    if(mode==='char'){ for(const ch of n.nodeValue){ const s=document.createElement('span'); s.className='ch'; s.textContent=ch; frag.appendChild(s); out.push(s);} }
    else { n.nodeValue.split(/(\s+)/).forEach(part=>{ if(!part) return; if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(' ')); return; } const s=document.createElement('span'); s.className='w'; s.textContent=part; frag.appendChild(s); out.push(s); }); }
    n.parentNode.replaceChild(frag,n); }
  return out;
}

// cover intro
(function intro(){
  const t=document.getElementById('title'); const chars=splitText(t,'char');
  gsap.set(chars,{opacity:0,y:22,rotation:()=>gsap.utils.random(-8,8)});
  gsap.to(chars,{opacity:1,y:0,rotation:0,duration:.9,stagger:.045,ease:'back.out(1.8)',delay:.4});
  gsap.from(env,{scale:.55,opacity:0,y:60,duration:1.3,ease:'back.out(1.4)',delay:.25});
  gsap.to(env,{y:-12,rotation:1.4,duration:2.8,yoyo:true,repeat:-1,ease:'sine.inOut',delay:1.6});
  gsap.from('#coverHint',{opacity:0,duration:1,delay:1.6}); gsap.to('#coverHint',{opacity:.45,duration:1.3,yoyo:true,repeat:-1,ease:'sine.inOut',delay:2.6});
  gsap.set('#seal',{xPercent:-50,yPercent:-50,rotation:-8}); gsap.set('#sealRing',{xPercent:-50,yPercent:-50});
  gsap.to('#seal',{filter:'drop-shadow(0 5px 10px rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(246,207,122,.9))',duration:1.4,yoyo:true,repeat:-1,ease:'sine.inOut'});
  gsap.fromTo('#sealRing',{opacity:.9,scale:1},{opacity:0,scale:2.2,duration:2,repeat:-1,ease:'power1.out',delay:.8});
  FX.dustMax=10;
})();

env.addEventListener('click',()=>{
  if(opened) return; opened=true; ac(); enableTilt();
  const sr=document.getElementById('seal').getBoundingClientRect(); const sx=sr.left+sr.width/2, sy=sr.top+sr.height/2;
  gsap.killTweensOf(env); gsap.killTweensOf('#seal'); gsap.killTweensOf('#sealRing'); gsap.killTweensOf('#coverHint');
  const tl=gsap.timeline();
  tl.call(()=>{ SFX.sealPop(); burst(sx,sy,50,{speed:5,size:3,up:1.5}); },null,0)
    .to('#sealRing',{opacity:0,duration:.1},0)
    .to('#seal',{scale:1.7,opacity:0,duration:.45,ease:'power2.in'},0)
    .to('#coverHint',{opacity:0,duration:.4},0)
    .to(env,{rotation:0,y:0,duration:.4},0)
    .call(()=>SFX.paper(),null,.3)
    .to('#flap',{rotationX:180,duration:1,ease:'power2.inOut'},.3)
    .set('#flap',{zIndex:0},.75)
    .call(()=>SFX.slide(),null,1.2)
    .to('#envLetter',{yPercent:-92,duration:1.1,ease:'power2.out'},1.2)
    .set('#envLetter',{zIndex:6},1.55)
    .to('#envLetter',{scale:1.7,y:'-=160',opacity:0,duration:.9,ease:'power2.in'},2.3)
    .to(['#title','.env .back','.env .front','.env .addr','.env .stamp','#flap'],{opacity:0,duration:.6},2.4)
    .call(()=>{ SFX.whoosh(); warp(1.6); },null,2.7)
    .to('#flash',{opacity:1,duration:.55,ease:'power2.in'},3.5)
    .call(()=>{ cover.style.display='none'; scene.classList.add('on'); gsap.set('#card',{opacity:0,scale:.92,y:30}); startNasheed(); },null,4.0)
    .to('#flash',{opacity:0,duration:1.4,ease:'power2.out'},4.1)
    .fromTo('.sky img',{scale:1.45},{scale:1.12,duration:4,ease:'power2.out'},4.0)
    .fromTo('#lanternWrap',{y:-560},{y:0,duration:1.9,ease:'elastic.out(1,.5)'},4.2)
    .call(()=>SFX.chain(),null,4.5)
    .fromTo('#lantern',{rotation:-6},{rotation:6,duration:2.6,yoyo:true,repeat:-1,ease:'sine.inOut'},4.4)
    .call(()=>{ SFX.ignite(); setLevel(1); const {x,y}=lanternXY(); burst(x,y,30,{speed:2.5,size:2.5,up:.8}); startCrackle(); },null,5.3)
    .to('#card',{opacity:1,scale:1,y:0,duration:1.1,ease:'power3.out'},5.8)
    .call(()=>next(),null,6.5);
});

function next(){
  if(finished) return;
  if(revealing){ finishCurrent(); return; }
  if(step>=STEPS.length){ end(); return; }
  const st=STEPS[step]; const el=document.createElement('div'); el.className='step'; el.innerHTML=st.html; card.appendChild(el);
  const spans=splitText(el,st.mode||'word'); const s=step; step++; revealing=true; curEl=el; hint.classList.remove('show');
  if(st.fx!=='greet') SFX.chime(s);
  const per=st.mode==='char'?.05:.075, dur=st.mode==='char'?.6:.75;
  if(spans.length>6 && st.mode!=='char') SFX.writing(Math.min(spans.length*per*1000,6500));
  gsap.set(spans,{opacity:0,y:st.mode==='char'?18:12,scale:st.mode==='char'?.7:1,filter:'blur(5px)'});
  curTween=gsap.to(spans,{opacity:1,y:0,scale:1,filter:'blur(0px)',duration:dur,stagger:per,ease:st.mode==='char'?'back.out(2)':'power2.out',onComplete:()=>done(el,st)});
  effects(st.fx,el,spans.length*per*1000);
  setLevel(Math.min(7,s+1));
  setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'end'}),120);
}
function done(el,st){ revealing=false; curTween=null;
  if(st&&st.fx==='greet'){ const chs=el.querySelectorAll('.ch'); gsap.set(chs,{clearProps:'filter'}); gsap.to(chs,{color:'#c8412a',textShadow:'0 0 14px rgba(224,169,74,.8)',duration:.5,stagger:{each:.07,repeat:-1,yoyo:true,repeatDelay:2.4},ease:'sine.inOut'}); }
  if(step>=STEPS.length) end(); else hint.classList.add('show'); }
function finishCurrent(){ if(curTween){ curTween.progress(1); } }

function effects(fx,el,ms){
  const L=()=>lanternXY();
  if(fx==='flame'){ setTimeout(()=>{ SFX.sparkle(); const {x,y}=L(); burst(x,y,40,{speed:3,size:2.5,up:1}); gsap.fromTo('#lglow',{scale:1.5},{scale:1.12,duration:1.4,ease:'power2.out'}); },900); }
  if(fx==='bricks'){
    const g=el.querySelector('#bricks'); const bricks=[]; const ns='http://www.w3.org/2000/svg';
    for(let r=0;r<5;r++){ const cnt=6-r; const bw=24,bh=11,gap=3; const total=cnt*(bw+gap)-gap; const x0=100-total/2; for(let c=0;c<cnt;c++){ const rc=document.createElementNS(ns,'rect'); rc.setAttribute('class','brick'); rc.setAttribute('x',x0+c*(bw+gap)); rc.setAttribute('y',108-(r+1)*(bh+gap)+gap); rc.setAttribute('width',bw); rc.setAttribute('height',bh); rc.setAttribute('rx',1.5); g.appendChild(rc); bricks.push(rc);} }
    const start=ms*.5+300;
    gsap.to(el.querySelector('.ground'),{strokeDashoffset:0,duration:.9,ease:'power2.out',delay:start/1000});
    gsap.fromTo(bricks,{opacity:0,y:-70,rotation:()=>gsap.utils.random(-25,25),transformOrigin:'50% 50%'},{opacity:1,y:0,rotation:0,duration:.75,stagger:{each:.11,onStart(){ if(!finished) SFX.tok(); }},ease:'bounce.out',delay:(start+600)/1000,
      onComplete(){ gsap.to(el.querySelector('.glowline'),{opacity:1,duration:.5,yoyo:true,repeat:3}); const r=el.querySelector('.build').getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height-10,30,{speed:3,size:2,up:2}); SFX.sparkle(); }});
  }
  if(fx==='stars'){ [800,1400,1900,2600,3100].forEach((d,i)=>setTimeout(()=>{ shoot(); SFX.meteor(); },d)); setTimeout(()=>{ const {x,y}=L(); burst(x,y,30,{speed:3,size:2.5}); SFX.sparkle(); },ms*.8); }
  if(fx==='gold'){ setTimeout(()=>{ SFX.gold(); gsap.fromTo('#flash',{opacity:0},{opacity:.35,duration:.5,yoyo:true,repeat:1,ease:'sine.inOut'}); const {x,y}=L(); burst(x,y,40,{speed:4,size:3,up:1}); gsap.to('#rays',{opacity:.55,duration:2}); gsap.to('#rays',{rotation:360,duration:120,repeat:-1,ease:'none'}); },300); }
  if(fx==='dua'){
    const m=el.querySelector('#mandala'); const ns='http://www.w3.org/2000/svg';
    for(let i=0;i<3;i++){ const r=90-i*22; for(let k=0;k<2;k++){ const p=document.createElementNS(ns,'rect'); p.setAttribute('x',-r); p.setAttribute('y',-r); p.setAttribute('width',2*r); p.setAttribute('height',2*r); p.setAttribute('transform',`rotate(${k*45+i*15})`); m.appendChild(p);} const c=document.createElementNS(ns,'circle'); c.setAttribute('r',r*.72); m.appendChild(c); }
    for(let a=0;a<360;a+=22.5){ const l=document.createElementNS(ns,'line'); l.setAttribute('x1',0); l.setAttribute('y1',-30); l.setAttribute('x2',0); l.setAttribute('y2',-96); l.setAttribute('transform',`rotate(${a})`); l.setAttribute('stroke-opacity','.5'); m.appendChild(l); }
    gsap.to(m,{opacity:.28,duration:2,delay:.2}); gsap.to(m,{rotation:360,duration:90,repeat:-1,ease:'none',transformOrigin:'50% 50%'});
    gsap.fromTo('#dua',{opacity:0,scale:.9},{opacity:1,scale:1,duration:1.1,ease:'back.out(1.4)'});
    setTimeout(()=>{ SFX.amin(); document.getElementById('amin').classList.add('pulse'); const r=document.getElementById('amin').getBoundingClientRect(); fountain(r.left+r.width/2,r.top+r.height/2,90); const {x,y}=L(); burst(x,y,60,{speed:4,size:3,up:1.5});
      gsap.fromTo('#lglow',{scale:1.8},{scale:1.4,duration:2,ease:'power2.out'}); gsap.to('#rays',{opacity:.85,duration:1.5}); gsap.fromTo('#flash',{opacity:0},{opacity:.45,duration:.6,yoyo:true,repeat:1}); },Math.max(1500,ms-600));
  }
  if(fx==='sign'){ setTimeout(()=>{ const {x,y}=L(); burst(x,y,30,{speed:3,size:2.5}); SFX.shimmer(); },600); }
}

function end(){
  if(finished) return; finished=true; hint.classList.remove('show');
  const btn=document.createElement('button'); btn.id='again'; btn.textContent='Прочитать ещё раз ↻'; btn.addEventListener('click',e=>{ e.stopPropagation(); location.reload(); }); card.appendChild(btn);
  setTimeout(()=>{ btn.classList.add('show'); gsap.to(btn,{opacity:1,duration:1}); btn.scrollIntoView({behavior:'smooth',block:'end'}); },700);
  setLevel(8); FX.dustMax=120; setInterval(()=>{ if(Math.random()<.5) shoot(); },4000);
  const r=card.getBoundingClientRect(); fountain(r.left+r.width/2,r.bottom-80,80);
}

scene.addEventListener('click',e=>{ if(e.target.closest('#again')||e.target.closest('#controls')) return; if(!opened) return; next(); });
addEventListener('pointerdown',e=>{ if(!opened||e.target.closest('button')) return; burst(e.clientX,e.clientY,14,{speed:2.2,size:2,up:.6}); });
</script>
